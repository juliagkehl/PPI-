<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>


<style>
    .container {border: 1px solid #1b6a81;
        background-color: #33c1ec;
       display: grid;
        /*grid-template-columns: 2fr 1fr 1fr;
        grid-template-rows: 200px 200px 200px;*/
        grid-template-rows: 100px 100px 100px;
        grid-template-areas:
        "Header Header"
        "Body Body"
        "Style Style";
    }

    .box{border: 1px solid #1b6a81;}

    #box-1{
        /*grid-column-start: 1;
        grid-column-end: 4;
        grid-row-start:1;
        grid-row-end:3;*/
        grid-area: Header;

        background-color: hotpink;
    }
    #box-2{
        grid-area: Body;
        background-color: gold;
    }

    #box-3{
    grid-area: Style;
    }

</style>
</head>
<body>
    
    <div class="container">
        <div class="box" id="box-1">box1</div>
        <div class="box" id="box-2">box2</div>
        <div class="box" id="box-3">box3</div>
        <div class="box" id="box-4">box4</div>
        <div class="box" id="box-5">box5</div>
        <div class="box" id="box-6">box6</div>
        <div class="box" id="box-7">box7</div>
        <div class="box" id="box-8">box8</div>
        <div class="box" id="box-9">box9</div>
    </div>
</body>
</html>
