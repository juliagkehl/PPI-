<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barquinho</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(to bottom, #79c9f2, #d8f3ff);
        }

        /* nuvem*/
        .nuvem {
            position: absolute;
            top: 80px;
            left: -180px;
            width: 130px;
            height: 45px;
            background-color: white;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: passarNuvem 25s linear infinite;
        }

        .nuvem::before {
            content: "";
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 50%;
            top: -30px;
            left: 25px;
        }

        .nuvem::after {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: white;
            border-radius: 50%;
            top: -35px;
            right: 15px;
        }

        /* marxzi */
        .mar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, #168dcc, #075c9c);
            z-index: 1;
            overflow: hidden;
        }

        /* ondas */
        .mar::before {
            content: "";
            position: absolute;
            top: -20px;
            left: -5%;
            width: 110%;
            height: 45px;
            background: radial-gradient(ellipse, #73d8f5 50%, transparent 52%);
            background-size: 90px 40px;
            animation: ondasMar 3s linear infinite;
        }

        .mar::after {
            content: "";
            position: absolute;
            top: 25px;
            left: -5%;
            width: 110%;
            height: 35px;
            background: radial-gradient(ellipse, #b4efff 45%, transparent 48%);
            background-size: 120px 35px;
            animation: ondasMar 4s linear infinite reverse;
        }

        /* Bbarco */
        .barco {
            position: absolute;
            width: 170px;
            height: 100px;
            background-image: url("imagens/barco.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            bottom: 30%;
            left: -180px;
            z-index: 2;

            animation:
                navegar 12s linear infinite,
                balancar 2s ease-in-out infinite;
        }

        /* Movimento do barco */
        @keyframes navegar {

            from {left: -180px;}

            to {left: 100%;}

        }

        /* Balanço do barco */
        @keyframes balancar {

            0% {transform: rotate(3deg);}

            50% {transform: rotate(-3deg) translateY(5px);}

            100% {transform: rotate(3deg);}

        }

        /* Movimento da nuvem */
        @keyframes passarNuvem {

            from {left: -180px;}

            to {left: 100%;}

        }

        /* Movimento das ondas */
        @keyframes ondasMar {

            from {transform: translateX(0);}

            to {transform: translateX(-90px);}

        }
    </style>
</head>

<body>

    <div class="nuvem"></div>
    <div class="barco"></div>
    <div class="mar"></div>

</body>

</html>
