<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>4c</title>

    <!-- os quadrados ficam em posições diferentes porque o position absolute define a posição usando top, bottom, left e right-->
    <style>
        body {
            height: 400px;
            position: relative;
        }

        div {
            width: 50px;
            height: 50px;
            position: absolute;
            text-align: center;
            padding-top: 15px;
            box-sizing: border-box;
        }

        .um {
            background-color: red;
            top: 20px;
            left: 20px;
        }

        .dois {
            background-color: yellow;
            top: 20px;
            right: 20px;
        }

        .tres {
            background-color: magenta;
            top: 120px;
            left: 100px;
        }

        .quatro {
            background-color: blue;
            bottom: 20px;
            left: 20px;
        }

        .cinco {
            background-color: green;
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>

<body>

    <div class="um">1</div>
    <div class="dois">2</div>
    <div class="tres">3</div>
    <div class="quatro">4</div>
    <div class="cinco">5</div>

</body>

</html>
