<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>4b </title>
<!--No 4b os elementos ficam lado a lado por que o display inline-block permite colocar as divs na mesma linha-->
    <style>
        div {
            width: 25%;
            height: 65px;
            display: inline-block;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .um {
            background-color: blueviolet;
        }

        .dois {
            background-color: green;
        }

        .tres {
            background-color: red;
        }

        .quatro {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div class="um">1</div>
    <div class="dois">2</div>
    <div class="tres">3</div>
    <div class="quatro">4</div>

</body>

</html>
