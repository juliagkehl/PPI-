<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>4a </title>

     <!--No 4a os elementos ficam um abaixo do outro porque o display padrao da div é block-->
    <style>
   
        div {
            width: 100%;
            height: 65px;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .um {
            background-color: blueviolet;
        }

        .dois {
            background-color: green;
        }

        .tres {
            background-color: red;
        }

        .quatro {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div class="um">1</div>
    <div class="dois">2</div>
    <div class="tres">3</div>
    <div class="quatro">4</div>

</body>

</html>
