<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Responsivo</title>

    <style>

        * {
            box-sizing: border-box;
        }
        body {margin: 0;
            padding: 1em;}

        .container {
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            grid-template-rows: 70px 40px 1fr 40px 40px;
            gap: 5px;
            min-height: 100vh;
        }

        header {
            grid-column: 1 / 4;
            background: #f2b705;
            padding: 1em;
        }

        .banner {
            grid-column: 2;
            background: #e32d26;
            padding: 1em;
        }
        .left {
            grid-column: 1;
            grid-row: 2 / 5;
            background: #0ca65a;
            padding: 1em;
        }

        main {
            grid-column: 2;
            grid-row: 3;
            background: #4285e8;
            padding: 1em;
        }

        .right {
            grid-column: 3;
            grid-row: 2 / 5;
            background: #f2b705;
            padding: 1em;
        }

        .low {
            grid-column: 2;
            grid-row: 4;
            background: #0ca65a;
            padding: 1em;
        }footer {
            grid-column: 1 / 4;
            grid-row: 5;
            background: #4285e8;
            padding: 1em;
        }

        @media screen and (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 50px 40px 350px 40px 40px 40px 40px;
            }

            header {grid-column: 1;
            grid-row: 1;}

            .banner {grid-column: 1;
            grid-row: 2;}

            .left {grid-column: 1;
            grid-row: 3;}

            main {grid-column: 1;
                grid-row: 4;}

            .right {grid-column: 1;
             grid-row: 5;}

            .low {grid-column: 1;
            grid-row: 6;}

            footer {grid-column: 1;
                grid-row: 7;}
        }
    </style>
</head>

<body>

    <div class="container">

        <header>Header</header>
        <div class="banner">Banner</div>
        <div class="left">Left Aside</div>
        
        <main>Main Content</main>
        <div class="right">Right Aside</div>
        <div class="low">Low Content</div>

        <footer>Footer</footer>

    </div>

</body>

</html>
