<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        body {
            margin: 0;
            padding: 1em;
        }

        .layout {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 100px 200px;
            gap: 10px;
        }

        .a {
            padding: 1em;
            grid-column: 1 / 4;
            grid-row: 1;
            background: #444;
            color: #ccc;
        }

        .b {
            padding: 1em;
            grid-column: 4;
            grid-row: 1;
            background: #444;
            color: #ccc;
        }

        .c {
            padding: 1em;
            grid-column: 1;
            grid-row: 2;
            background: #444;
            color: #ccc;
        }

        .letras {
            grid-column: 2 / 5;
            grid-row: 2;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            background: #444;
            padding: 10px;
        }

        .letras div {
            padding: 1em;
            background: #ccc;
        }

        div {
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="layout">

        <div class="a">A</div>
        <div class="b">B</div>
        <div class="c">C</div>
        <div class="letras">
            <div>E</div>
            <div>F</div>
            <div>G</div>
            <div>M</div>
            <div>I</div>
            <div>J</div>
        </div>

    </div>

</body>

</html>
