<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sorteio </title>

        <style>

     .container { display: flex;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .inputs { display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

    </style>
    </head>

    <body>

        <div class="container">
            <div class="form">
                <div class="inputs">
                    <label for="min">minimo</label>
                    <input type="number" id="min">

                    <label for="max">maximo</label>
                    <input type="number" id="max"></div>
            </div>

            <button id="botaoSortear">Sortear</button>
            <h2 id="result">-</h2>

        </div>
        <script>

    btnSortear = document.getElementById("botaoSortear");
    min = document.getElementById("min");
    max = document.getElementById("max");
    result = document.getElementById("result");

    btnSortear.addEventListener("click", () => {
        minimo = Number(min.value);
        maximo = Number(max.value);

        if (min.value === "" || max.value === "") {
            result.innerHTML = "Preencha os dois campos!";
            return;
        }

        if (minimo > maximo) {
            result.innerHTML = "O mínimo deve ser menor que o máximo!";
                return;
        }

      let random = Math.floor(Math.random() * (maximo - minimo + 1)) + minimo;
            result.innerHTML = random;
        });
        
    </script>

    </body>

</html>
