<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 0.5fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 4px;
            padding: 20px;
        }

        #bloco1 {
            background-color: #f6a623;
            grid-column: 1;
            grid-row: 1;
        }

        #bloco2 {
            background-color: #b9cbe3;
            grid-column: 1;
            grid-row: 2;
        }

        #bloco3 {
            background-color: #f3b5a5;
            grid-column: 2;
            grid-row: 1 / 3;
        }

        #bloco4 {
            background-color: #f5b52e;
            grid-column: 1 / 3;
            grid-row: 3;
        }

        #bloco5 {
            background-color: #b9ce70;
            grid-column: 3;
            grid-row: 2 / 4;
        }

        #bloco6 {
            background-color: #c7dddd;
            grid-column: 3 / 5;
            grid-row: 1;
        }

        .circulos {
            grid-column: 4;
            grid-row: 2 / 4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .circulo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        #c1 {background-color: #ee9560}

        #c2 { background-color: #d9aaaa;}

        #c3 {background-color: #c2ce9a;}

        #c4 { background-color: #c9b7df;}

        @media screen and (max-width: 600px) {
        .container {
                height: auto;
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 15px;
        }

            #bloco1,
            #bloco2,
            #bloco3,
            #bloco4,
            #bloco5,
            #bloco6 {
                width: 100%;
                height: 120px;
            }

            .circulos {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 10px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="bloco1"></div>
        <div id="bloco2"></div>
        <div id="bloco3"></div>
        <div id="bloco4"></div>
        <div id="bloco5"></div>
        <div id="bloco6"></div>

        <div class="circulos">
            <div class="circulo" id="c1"></div>
            <div class="circulo" id="c2"></div>
            <div class="circulo" id="c3"></div>
            <div class="circulo" id="c4"></div>
        </div>
    </div>
</body>

</html>
